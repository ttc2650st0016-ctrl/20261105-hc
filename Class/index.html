<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">

    <title>class</title>
</head>

<body>
    <h2>同一の要素の中で、特定の要素だけ分解</h2>
    <p class="hiragana">あいうえお</p>
    <p class="hiragana">かきくけこ</p>
    <p class="hiragana">さしすせそ</p>
    <p>アイウエオ</p>
    <p>カキクケコ</p>
    <p>サシスセソ</p>

    <h2>異なる要素に同一の性質を持たせる</h2>
    <button>送信</button>
    <p>送信しました</p>

    <button class="test">テストボタン</button>
    <p class="test">これはテスト用です</p>

    <h2>異なるグループ分けをして、同一の要素のスタイルを分ける</h2>
    <div class="morning">
        <p>おはようございます</p>
    </div>

    <div class="night">
        <p>おやすみなさい</p>
    </div>



</body>
</html>
